[project]
name = "cloudness-detection"
version = "0.1.0"
description = "Кейс СПУТНИКС: оценка облачности на RGB-снимках обзорных камер"
readme = "README.md"
authors = [
    { name = "Andrew Vorobev", email = "vorandpav@yandex.ru" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "pillow>=11.0",
    "python-pptx>=1.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[project.scripts]
select-photos-40 = "cloudness_detection.select_photos_40:main"
eda-photos = "cloudness_detection.eda_photos:main"
eda-38cloud = "cloudness_detection.eda_38cloud:main"
eda-compare = "cloudness_detection.eda_compare:main"
eda-sparcs = "cloudness_detection.eda_sparcs:main"
train-unet = "cloudness_detection.train_unet:main"
train-mix = "cloudness_detection.train.train_mix:main"

[build-system]
# setuptools: pip install -e . на Kaggle (uv_build там нет).
# Локально uv тоже умеет этот backend.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
